<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Binder</title>
  <link href="style.css" rel="stylesheet">
  <script src="script.js" defer></script>
</head>

<body>
  <header>
    <h1>Card Binder</h1>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-search" aria-selected="true">Search</button>
      <button class="tab" role="tab" id="t-coll" aria-selected="false">My collection <span id="count"></span></button>
    </div>
    <form id="form">
      <input type="search" id="q" placeholder="Card name or Scryfall syntax" aria-label="Search cards" autocomplete="off">
      <button class="go" type="submit">Search</button>
    </form>
    <p class="hint" id="hint">Try <code>lightning bolt</code>, <code>t:dragon c:red</code>, or <code>o:"draw a card" cmc&lt;=2</code>.</p>
  </header>

  <main>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="bar" id="bar" hidden></div>
    <div class="grid" id="grid"></div>
    <button class="more" id="more" hidden>Load more</button>
  </main>

  <dialog id="dlg"><img id="big" alt=""></dialog>
</body>
</html>
